<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciudad · Mentedoras</title>
<meta name="theme-color" content="#111418">
<style>
  :root{--bg:#111418;--panel:#181f28;--ink:#e8eef5;--mut:#8fa3b8;--cy:#00e5e5;--line:#26323f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  header{position:fixed;left:0;right:0;top:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;pointer-events:none}
  .brand{font:italic 700 24px Georgia,serif;color:var(--cy);pointer-events:auto;text-decoration:none}
  .brand small{display:block;font:500 11px system-ui;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
  .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);text-decoration:none;display:flex;gap:8px;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%}
  #banner{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#3b2a0a;border:1px solid #f59e0b;color:#fcd34d;border-radius:10px;padding:6px 12px;font-size:12px;display:none}
  #panel{position:fixed;top:0;right:0;height:100%;width:min(360px,100vw);background:var(--panel);border-left:1px solid var(--line);padding:18px;transform:translateX(105%);transition:transform .25s;overflow:auto}
  #panel.open{transform:none}
  #panel h2{margin:0 0 2px;font:italic 700 24px Georgia,serif;color:var(--cy)}
  #panel .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row span:first-child{color:var(--mut)}
  .reels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .reel{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
  .reel b{display:block;font-size:13px;margin-bottom:2px}
  .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
  .btn{display:inline-block;margin-top:14px;background:var(--cy);color:#00282a;font-weight:700;border-radius:10px;padding:9px 14px;text-decoration:none;font-size:14px}
  .legend{position:fixed;left:16px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);pointer-events:none}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  @media (max-width:700px){.brand{font-size:18px}.chip{padding:4px 9px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <a class="brand" href="/">Mentedoras<small>Ciudad de clientes</small></a>
  <div class="right" id="chips"></div>
</header>
<div id="banner"></div>
<aside id="panel"><button class="x" id="close" aria-label="Cerrar">×</button><div id="pbody"></div></aside>
<div class="legend">
  <span><i style="background:#3a4756"></i>Reel pendiente</span>
  <span><i style="background:#f59e0b"></i>Grabado</span>
  <span><i style="background:#a855f7"></i>Editado</span>
  <span><i style="background:#00e5e5"></i>Subido</span>
</div>
<script>
/* Solo LECTURA: lee los clientes de tu Firebase (crm/clients). No escribe nada. */
const FIREBASE_CONFIG = null; // se rellena sola desde el CRM (ver loadConfig)
const PHASES=['Pendiente de crear guion','Pendiente de OK de guion','Pendiente de grabación','Grabado, pendiente de editar','Editándose','Editado, pendiente de revisión','Revisado','Pendiente de subir','¡Subido! 🎉'];
const PHC=['#3B82F6','#10B981','#F59E0B','#F97316','#A855F7','#EC4899','#EF4444','#06B6D4','#00E5E5'];
const REEL_COL={pend:'#3a4756',grab:'#f59e0b',edit:'#a855f7',sub:'#00e5e5'};

let clients=[], demo=false;
const DEMO=[
  {id:'d1',name:'Green Wash',type:'Lavadero de coches',phase:2,numReels:5,editors:['Dani'],cm:'Laura'},
  {id:'d2',name:'Schwa',type:'Academia de idiomas',phase:4,numReels:5,editors:['Darwin'],cm:'Laura'},
  {id:'d3',name:'FOKO',type:'Museo sensorial',phase:7,numReels:5,editors:['Dante']},
  {id:'d4',name:'Hector',type:'Coach empresarial',phase:3,numReels:8,editors:['Oscar'],cm:'Laura'},
  {id:'d5',name:'Linda',type:'Podóloga',phase:8,numReels:5,editors:['Darwin']}
];

/* ---- carga de datos (Firebase en solo lectura) ---- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function loadConfig(){
  // reutiliza la misma configuración pública que ya usa el CRM (index.html), sin duplicarla aquí
  const html=await (await fetch('/index.html',{cache:'no-store'})).text();
  const m=html.match(/const FIREBASE_CONFIG=(\{[^}]+\})/); if(!m) throw new Error('config no encontrada');
  return Function('return '+m[1])();
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,ko)=>setTimeout(()=>ko(new Error('tiempo agotado')),ms))]);
async function load(){
  try{
    clients=await withTimeout((async()=>{
      const cfg=await loadConfig();
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      const db=firebase.firestore();
      // mismo orden que el CRM: índice + client_docs, y la lista antigua solo como reserva
      let list=null;
      const idx=await db.collection('crm').doc('clients_index').get();
      if(idx.exists&&idx.data().ids&&idx.data().ids.length){
        const q=await db.collection('client_docs').get();const byId={};q.forEach(d=>{byId[d.id]=d.data()});
        list=idx.data().ids.map(id=>byId[id]).filter(Boolean);
      }
      if(!list||!list.length){const snap=await db.collection('crm').doc('clients').get();list=snap.exists&&snap.data().list}
      if(!list||!list.length) throw new Error('sin clientes');
      return list.filter(isActive);
    })(),12000);
  }catch(e){
    console.warn('Ciudad: usando datos de ejemplo →',e);
    demo=true;clients=DEMO;
    const b=document.getElementById('banner');b.style.display='block';
    b.textContent='Datos de ejemplo: no se pudieron leer tus clientes ('+(e.message||e)+')';
  }
  layout();chips();
}

/* ---- helpers de cliente ---- */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function monthLabel(k){const [y,m]=k.split('-');return MESES[+m-1]+' '+y}
function monthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const isActive=c=>c.active!==false; // misma regla que el CRM
function reelsOf(c){ // reels del mes actual, como el panel del CRM
  const r=c.reels; if(!r||Array.isArray(r)) return Array.isArray(r)?r:[];
  return r[monthKey()]||[];
}
function reelState(r){return r.subido?'sub':r.editado?'edit':r.grabado?'grab':'pend'}
function stats(c){const rs=reelsOf(c);const s={pend:0,grab:0,edit:0,sub:0};rs.forEach(r=>s[reelState(r)]++);return {rs,s}}
function chips(){
  // mismas cuentas que las tarjetas del Resumen del CRM
  let grab=0,total=0,editing=0;
  clients.forEach(c=>{const r=reelsOf(c);total+=r.length;grab+=r.filter(x=>x.grabado).length;editing+=r.filter(x=>x.editado&&!x.subido).length});
  const overdue=clients.filter(c=>c.delivery&&new Date(c.delivery+'T12:00:00')<new Date()).length;
  document.getElementById('chips').innerHTML=
   `<span class="chip"><span class="dot" style="background:#00e5e5"></span>${clients.length} clientes activos</span>`+
   `<span class="chip"><span class="dot" style="background:#ef4444"></span>${overdue} entregas vencidas</span>`+
   `<span class="chip"><span class="dot" style="background:#a855f7"></span>${editing} reels en edición</span>`+
   `<span class="chip"><span class="dot" style="background:#f59e0b"></span>${grab}/${total} grabados este mes</span>`+
   `<span class="chip"><span class="dot" style="background:#38bdf8"></span>${clients.reduce((n,c)=>n+reelsOf(c).filter(x=>x.grabado&&!x.editado).length,0)} esperando editor</span>`+
   `<a class="chip" href="/">← Volver al CRM</a>`;
}

/* ---- canvas isométrico ---- */
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const TW=64,TH=32; let W,H,dpr=Math.min(devicePixelRatio||1,2),cam={x:0,y:0,z:1,fit:1};
let islands=[],hover=null,selected=null,minX=0,maxX=1,minY=0,maxY=1;
const iso=(x,y,z=0)=>({X:cam.x+(x-y)*TW/2*cam.z,Y:cam.y+(x+y)*TH/2*cam.z-z*cam.z});
/* ---- equipo: una casita por editor y por community manager, con sus reels en cola ---- */
const PAL=['#38bdf8','#f472b6','#a3e635','#fb923c','#c084fc','#facc15','#2dd4bf','#f87171','#94a3b8','#60a5fa','#34d399','#fb7185'];
const HS=2.4,HG=1.8; let houses=[],staffMap={};
const ROLE={
  editor:{icon:'✂',busy:'para editar',idle:'sin cola',title:'Editor/a de vídeo',q:'Reels para editar (grabados)',d:'Editados este mes'},
  cm:{icon:'📱',busy:'para subir',idle:'al día',title:'Community manager',q:'Reels para subir (editados)',d:'Subidos este mes'},
  pub:{icon:'📅',busy:'a subir ≤7 días',idle:'al día',title:'Calendario de publicación: reels con fecha en los próximos 7 días o atrasados',q:'Reels por subir (≤7 días o atrasados)',d:'Reels ya subidos'},
  cuentas:{icon:'📑',busy:'a vigilar',idle:'todo en orden',title:'Cuentas: contratos que vencen en 30 días, vencidos y entregas vencidas',q:'Casos a vigilar',d:'—'},
  guion:{icon:'✍',busy:'sin guion',idle:'al día',title:'Guiones: clientes pendientes de crear o aprobar el guion',q:'Clientes esperando guion',d:'Clientes ya con guion aprobado'},
  owner:{icon:'⭐',busy:'clientes con reels sin subir',idle:'todo al día',title:'Responsable de cuenta (presentador del podcast): sus clientes con reels aún sin subir',q:'Clientes con reels sin subir',d:'Clientes a su cargo'},
  informes:{icon:'📊',busy:'por hacer',idle:'a tu orden',title:'Informes: genera el informe semanal o mensual de cualquier cliente',q:'Pídele un informe abajo',d:'—'}
};
const skey=(role,name)=>role+'|'+name;
function buildStaff(){
  const m={};
  const get=(role,name)=>m[skey(role,name)]||(m[skey(role,name)]={role,name,queue:[],done:0,clients:new Set()});
  clients.forEach(c=>{
    const eds=Array.isArray(c.editors)?c.editors:[];
    eds.forEach(e=>get('editor',e).clients.add(c.id));
    if(c.cm)get('cm',c.cm).clients.add(c.id);
    reelsOf(c).forEach(r=>{
      const e=r.editor||eds[0];
      if(e){const S=get('editor',e);S.clients.add(c.id);if(r.grabado&&!r.editado)S.queue.push({c,r});if(r.editado)S.done++}
      if(c.cm){const S=get('cm',c.cm);if(r.editado&&!r.subido)S.queue.push({c,r});if(r.subido)S.done++}
    });
  });
  /* trabajadores de puesto: salen de fechas y fases reales del CRM */
  const iso0=d=>d.toISOString().slice(0,10),t0=iso0(new Date()),t7=iso0(new Date(Date.now()+7*864e5)),t30=iso0(new Date(Date.now()+30*864e5)),t14=iso0(new Date(Date.now()-14*864e5));
  const fmt=d=>d.slice(8)+'/'+d.slice(5,7);
  const post=(role,name)=>m[skey(role,name)]=m[skey(role,name)]||{role,name,queue:[],done:0,clients:new Set()};
  const pub=post('pub','Don Calendario'),cta=post('cuentas','Controlador de cuentas'),gui=post('guion','El Guionista');post('informes','Los Señores del Informe');
  clients.forEach(c=>{
    Object.entries(c.pubCal||{}).forEach(([mk,byReel])=>Object.entries(byReel||{}).forEach(([rid,pd])=>{
      const reel=(Array.isArray(c.reels)?c.reels:((c.reels||{})[mk]||[])).find(r=>String(r.id)===String(rid));
      const ds=['pub','tiktok','youtube'].map(k=>pd&&pd[k]).filter(Boolean).sort();
      if(!reel||!ds.length)return;
      if(reel.subido){pub.done++;return}
      if(ds[0]<t14){pub.stale=(pub.stale||0)+1;return} // fechas antiguas que nadie marcó como subidas
      if(ds[0]<=t7){pub.queue.push({c,r:reel,date:ds[0],note:(reel.label||'Reel')+' · '+(ds[0]<t0?'atrasado ':ds[0]===t0?'hoy ':'')+fmt(ds[0])});pub.clients.add(c.id)}
    }));
    if(c.contractEnd&&c.contractEnd<=t30){cta.queue.push({c,date:c.contractEnd,note:(c.contractEnd<t0?'contrato vencido ':'contrato vence ')+fmt(c.contractEnd)});cta.clients.add(c.id)}
    if(c.delivery&&new Date(c.delivery+'T12:00:00')<new Date()){cta.queue.push({c,date:c.delivery,note:'entrega vencida '+fmt(c.delivery)});cta.clients.add(c.id)}
    const ph=+c.phase||0;
    if(ph<=1){gui.queue.push({c,note:ph===0?'pendiente de crear guion':'pendiente de OK de guion'});gui.clients.add(c.id)}else gui.done++;
  });
  clients.forEach(c=>{if(!c.accountOwner)return;const o=post('owner',c.accountOwner),p=reelsOf(c).filter(r=>!r.subido).length;o.clients.add(c.id);o.done++;if(p)o.queue.push({c,note:p+' reel'+(p===1?'':'s')+' sin subir'})});
  pub.queue.sort((a,b)=>a.date.localeCompare(b.date));cta.queue.sort((a,b)=>a.date.localeCompare(b.date));
  const ORD={owner:-1,editor:0,cm:1,pub:2,cuentas:3,guion:4,informes:5};
  const list=Object.values(m).sort((a,b)=>(ORD[a.role]-ORD[b.role])||a.name.localeCompare(b.name,'es'));
  list.forEach((s,i)=>s.color=PAL[i%PAL.length]);
  staffMap=m;return list;
}
function layout(){
  const n=clients.length,cols=Math.max(1,Math.ceil(Math.sqrt(n))),S=3,G=1.6;
  islands=clients.map((c,i)=>({c,x:(i%cols)*(S+G),y:Math.floor(i/cols)*(S+G),s:S}));
  const rows=Math.ceil(n/cols),gw=cols*(S+G),gh=rows*(S+G);
  const staff=buildStaff().filter(s=>s.role!=='editor'&&s.role!=='cm'),sx=gw+1.2; // sin las personas editoras/CM: solo los puestos
  houses=staff.map((st,i)=>({staff:st,x:sx+(i%2)*(HS+HG),y:Math.floor(i/2)*(HS+HG),s:HS}));
  maxX=houses.length?sx+2*(HS+HG):gw;maxY=Math.max(gh,Math.ceil(houses.length/2)*(HS+HG));fit();buildWalkers();
}
function fit(){
  W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const w=(maxX+maxY)*TW/2+160,h=(maxX+maxY)*TH/2+200;
  cam.z=Math.max(.3,Math.min(1.4,W/w,(H-80)/h));
  cam.x=W/2-((maxX-maxY)/2)*TW/2*cam.z;cam.y=H/2-((maxX+maxY)/2)*TH/2*cam.z+10;
}
addEventListener('resize',fit);
function shade(hex,p){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v));return `rgb(${c((n>>16)+p)},${c((n>>8&255)+p)},${c((n&255)+p)})`}
function box(x,y,w,h,z,top,side,d){
  const a=iso(x,y,z),b=iso(x+w,y,z),c=iso(x+w,y+h,z),e=iso(x,y+h,z),k=d*cam.z;
  cx.fillStyle=side;cx.beginPath();cx.moveTo(e.X,e.Y);cx.lineTo(c.X,c.Y);cx.lineTo(c.X,c.Y+k);cx.lineTo(e.X,e.Y+k);cx.fill();
  cx.fillStyle=shade(side.startsWith('#')?side:'#222222',-14);cx.beginPath();cx.moveTo(b.X,b.Y);cx.lineTo(c.X,c.Y);cx.lineTo(c.X,c.Y+k);cx.lineTo(b.X,b.Y+k);cx.fill();
  cx.fillStyle=top;cx.beginPath();cx.moveTo(a.X,a.Y);cx.lineTo(b.X,b.Y);cx.lineTo(c.X,c.Y);cx.lineTo(e.X,e.Y);cx.closePath();cx.fill();
}
function pill(t,x,y,z,color,size){
  const p=iso(x,y,z);cx.font=`600 ${size*cam.z}px system-ui`;cx.textAlign='center';
  const w=cx.measureText(t).width+14*cam.z,h=20*cam.z;cx.fillStyle='#181f28ee';
  cx.beginPath();if(cx.roundRect)cx.roundRect(p.X-w/2,p.Y-h*.75,w,h,7*cam.z);else cx.rect(p.X-w/2,p.Y-h*.75,w,h);cx.fill();cx.fillStyle=color;cx.fillText(t,p.X,p.Y);
}
function draw(ts){
  try{paint(ts)}catch(e){console.warn('Ciudad: error al dibujar',e)}
  requestAnimationFrame(draw);
}
/* modo Sims: el rombo (plumbob) sobre la cabeza es su estado de ánimo = su carga de trabajo real */
const MOOD={ok:'#4ade80',busy:'#facc15',bad:'#ef4444'},SHOW_MOOD=false; // rombo apagado a petición del usuario
const moodOf=st=>!st.queue.length?MOOD.ok:(st.queue.length>=7||st.queue.some(q=>q.note&&/atrasado|vencid/.test(q.note)))?MOOD.bad:MOOD.busy;
function person(x,y,z,color,t,working,mood){
  const s=cam.z,q=iso(x,y,z+(working?Math.sin(t)*1.2:0)),g=iso(x,y,z);
  cx.fillStyle='#0006';cx.beginPath();cx.ellipse(g.X,g.Y+2*s,6*s,2.5*s,0,0,7);cx.fill();
  cx.fillStyle=color;cx.beginPath();if(cx.roundRect)cx.roundRect(q.X-4.5*s,q.Y-13*s,9*s,13*s,3.5*s);else cx.rect(q.X-4.5*s,q.Y-13*s,9*s,13*s);cx.fill();
  cx.fillStyle='#f1d4b8';cx.beginPath();cx.arc(q.X,q.Y-17.5*s,4.5*s,0,7);cx.fill();
  cx.fillStyle='#2b2118';cx.beginPath();cx.arc(q.X,q.Y-19*s,4.6*s,Math.PI,0);cx.fill(); // pelo
  if(mood&&SHOW_MOOD){const b=Math.sin(t*.6)*1.5,cy=q.Y-32*s+b*s,w=3.6*s,h=6*s;
    cx.fillStyle=mood;cx.beginPath();cx.moveTo(q.X,cy-h);cx.lineTo(q.X+w,cy);cx.lineTo(q.X,cy+h);cx.lineTo(q.X-w,cy);cx.closePath();cx.fill();
    cx.fillStyle='#fff6';cx.beginPath();cx.moveTo(q.X,cy-h);cx.lineTo(q.X+w,cy);cx.lineTo(q.X,cy);cx.closePath();cx.fill()}
}
function drawHouse(h,ts){
  const st=h.staff,col=st.color,act=(hover===h||selected===h),busy=st.queue.length>0,t=ts/1000;
  box(h.x,h.y,h.s,h.s,0,'#1d2a37','#121b24',6);
  const bx=h.x+.35,by=h.y+.2,bw=h.s-.7,bh=1.4;
  box(bx,by,bw,bh,26,shade(col,-95),shade(col,-135),26);
  box(bx-.2,by-.2,bw+.4,bh+.4,34,act?col:shade(col,-30),shade(col,-80),8);
  const px=h.x+h.s/2-.45,py=h.y+1.75;
  box(h.x+.5,h.y+1.8,1.0,.45,8,'#2a3a4b','#1b2733',8);
  box(h.x+.8,h.y+1.85,.4,.3,8.5,busy?'#00e5e5':'#3a4756','#1b2733',.5);
  st.queue.slice(0,9).forEach((q,i)=>box(h.x+1.7+(i%3)*.22,h.y+1.75+Math.floor(i/3)*.22,.18,.18,6,PHC[Math.max(0,Math.min(8,+q.c.phase||0))],'#222',6));
  pill(st.name,h.x+h.s/2,h.y+h.s/2,52,col,13);
  const R=ROLE[st.role],lab=busy?`${st.queue.length} ${R.busy}`:R.idle;
  pill(R.icon+' '+lab,h.x+h.s/2,h.y+h.s+.3,-2,busy?'#fcd34d':'#8fa3b8',11);
  if(!busy){const z=iso(px+.3,py,34);cx.fillStyle='#8fa3b8';cx.font=`700 ${12*cam.z}px system-ui`;cx.fillText('z Z',z.X,z.Y+Math.sin(t*2)*2)}
  if(act){const p=iso(h.x+h.s/2,h.y+h.s/2,0);cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.ellipse(p.X,p.Y+6*cam.z,h.s*TW/2*.8*cam.z,h.s*TH/2*.8*cam.z,0,0,7);cx.stroke()}
}
/* ---- caminantes: quien tiene trabajo sale con un reel a la isla del cliente, trabaja y vuelve ---- */
let walkers=[],lastTs=0;
const homeOf=h=>({x:h.x+h.s/2-.45,y:h.y+1.78});
/* Pasean solos (es solo movimiento), pero el TRABAJO —informes, listas— solo lo hacen cuando se lo pides. */
const auto=true;
function buildWalkers(){walkers=houses.flatMap(h=>{const n=h.staff.role==='informes'?2:1; // «los señores»: son dos
  return Array.from({length:n},(_,k)=>{const p=homeOf(h);if(n>1)p.x+=k?.5:-.2;return{h,st:h.staff,home:p,x:p.x,y:p.y,tx:p.x,ty:p.y,state:'sit',t:Math.random()*3+k,col:null,req:null,tint:k?'#94a3b8':null}})})}

function stepWalkers(dt){

    const home=w.home;
    if(w.state==='sit'||w.state==='work'){
      w.t+=dt;
      if(w.state==='sit'&&((w.req&&w.t>.3)||(auto&&w.st.queue.length&&w.t>2.5))){
        const q=w.st.queue[Math.floor(Math.random()*w.st.queue.length)],cl=(w.req&&w.req.cl)||(q&&q.c)||clients.find(c=>w.st.clients.has(c.id)),is=cl&&islands.find(i=>i.c===cl);

      }else if(w.state==='work'&&w.t>3){w.tx=home.x;w.ty=home.y;w.state='back'}
      return;
    }
    const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy),step=1.7*dt;

  });
}

function hit(mx,my){
  let best=null;
  const inPoly=(P)=>{let r=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const A=P[i],B=P[j];if((A.Y>my)!==(B.Y>my)&&mx<(B.X-A.X)*(my-A.Y)/(B.Y-A.Y)+A.X)r=!r}return r};
  [...islands,...houses].forEach(is=>{
    const foot=z=>[iso(is.x,is.y,z),iso(is.x+is.s,is.y,z),iso(is.x+is.s,is.y+is.s,z),iso(is.x,is.y+is.s,z)];
    const inside=inPoly(foot(0))||inPoly(foot(40))||inPoly([...foot(0).slice(2),...foot(40).slice(0,2).reverse()]);
    if(inside&&(!best||(is.x+is.y)>(best.x+best.y)))best=is});
  return best;
}

    <div class="row"><span>Clientes implicados</span><span>${st.clients.size}</span></div>
    ${st.stale?`<div class="row"><span>Con fecha antigua (+14 días) sin marcar como subidos</span><span>${st.stale}</span></div>`:''}
    <div class="sub" style="margin-top:14px">${detail?'Detalle':'En cola por cliente'}</div>
    ${Object.values(by).map(g=>`<div class="row"><span><a href="#" data-c="${esc(g.c.id)}" style="color:var(--cy);text-decoration:none">${esc(g.c.name)}</a>${g.notes.length?`<br><small style="color:var(--mut)">${g.notes.map(esc).join(' · ')}</small>`:''}</span><span>${g.notes.length?'':g.n}</span></div>`).join('')||'<div class="sub">Nada pendiente. 🎉</div>'}
    ${needsOf(st).length?`<div class="box" style="background:#2a2410;border:1px solid #f59e0b;border-radius:10px;padding:10px;margin-top:14px;font-size:13px"><b style="color:#fcd34d">Necesito de ti</b>${needsOf(st).map(x=>`<div style="margin-top:4px">• ${esc(x)}</div>`).join('')}</div>`:''}
    <div class="sub" style="margin:18px 0 6px">Pídele algo a ${esc(st.name)}</div>${toolsHtml(st)}
    <a class="btn" href="/">Abrir en el CRM</a>`;
  document.getElementById('panel').classList.add('open');
  wireTools(st);
}

/* ---- peticiones: el trabajador hace el trabajo aquí mismo, con los datos del CRM ---- */
const FLD='background:#0f151c;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 9px;font-size:13px;width:100%';
const BTN='background:var(--cy);color:#00282a;font-weight:700;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer';
function toolsHtml(st){
  const hint=st.role==='informes'?'p. ej. «informe mensual de GINTONICS»':'p. ej. «qué tengo de '+esc((clients[0]||{}).name||'un cliente')+'» o déjalo vacío';
  let h=`<div style="display:flex;gap:6px"><input id="req" style="${FLD}" placeholder="${hint}"><button id="reqgo" style="${BTN}">Pedir</button></div>`;
  if(st.role==='informes'){
    const ig=[['views','Visualizaciones'],['reach','Cuentas alcanzadas'],['inter','Interacciones'],['visits','Visitas al perfil'],['fol','Seguidores'],['newfol','Seguidores nuevos'],['clicks','Clics en la bio']];
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
      <select id="icl" style="${FLD}">${clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>
      <select id="ipe" style="${FLD}"><option value="semana">Semanal</option><option value="mes">Mensual</option></select></div>
      <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--mut);font-size:13px">Cifras de Instagram (opcional)</summary>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">${ig.map(([k,l])=>`<input id="ig-${k}" inputmode="numeric" placeholder="${l}" style="${FLD}">`).join('')}</div>
      <div class="sub" style="margin-top:6px">En el CRM no hay datos de Instagram: si no los escribes, el informe solo cuenta la producción.</div></details>
      <div class="sub" id="ineed" style="margin:12px 0 4px"></div>
      ${SHOTS.map(([k,l,w])=>`<label style="display:block;font-size:13px;margin:6px 0 2px">📸 ${l}${w==='mes'?' <span style="color:var(--mut)">(solo mensual)</span>':''}</label><input type="file" id="sh-${k}" accept="image/*" multiple style="font-size:12px;width:100%">`).join('')}
      <button id="igo" style="${BTN};margin-top:10px;width:100%">Generar informe</button>`;
  }
  return h+`<div id="res" style="margin-top:10px"></div>`;
}
/* capturas que pide el trabajador de informes (las del anexo de tu informe de ejemplo) */
const SHOTS=[['res','Resumen de Instagram Insights (visualizaciones, seguidores, interacciones)'],['diario','Gráfica de visualizaciones diarias','mes'],['top','Publicaciones con más visualizaciones'],['aud','Audiencia por género y edad','mes']];
function periodRange(per){const f=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'long'}),b=new Date(Date.now()-(per==='mes'?30:7)*864e5);return `del ${f(b)} al ${f(new Date())}`}
/* lo que el trabajador necesita de ti y no está en el CRM */
function needsOf(st){
  const mk=monthKey(),out=[];
  if(st.role==='editor'||st.role==='cm'){const sin=clients.filter(c=>reelsOf(c).some(r=>r.grabado&&!r.editado&&!r.editor&&!(c.editors||[]).length)).map(c=>c.name);if(sin.length)out.push('Asignar editor a: '+sin.join(', '))}
  if(st.role==='pub'){const sin=[];clients.forEach(c=>{const pc=(c.pubCal||{})[mk]||{};const n=reelsOf(c).filter(r=>r.editado&&!r.subido&&!(pc[r.id]&&(pc[r.id].pub||pc[r.id].tiktok||pc[r.id].youtube))).length;if(n)sin.push(c.name+' ('+n+')')});if(sin.length)out.push('Fecha de publicación de reels ya editados: '+sin.join(', '))}
  if(st.role==='cuentas'){const sin=clients.filter(c=>!c.contractEnd&&c.clientType!=='intercambio').map(c=>c.name);if(sin.length)out.push('Fecha de fin de contrato de: '+sin.join(', '))}
  if(st.role==='guion'){const sin=clients.filter(c=>(+c.phase||0)===0).length;if(sin)out.push(sin+' clientes aún sin guion: dime a cuáles priorizar y qué temas quieres')}
  if(st.role==='informes')out.push('Capturas de Instagram Insights (abajo), o escribe las cifras a mano');
  return out;
}
function wireTools(st){
  const req=document.getElementById('req'),go=document.getElementById('reqgo'),res=document.getElementById('res');
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const find=t=>{t=norm(t);return clients.filter(c=>t.includes(norm(c.name))).sort((a,b)=>String(b.name).length-String(a.name).length)[0]||clients.find(c=>norm(c.name).split(/[^a-z0-9]+/).some(w=>w.length>=4&&new RegExp('\\b'+w).test(t)))};
  const text=cl=>{
    const L=st.queue.filter(q=>!cl||q.c===cl).map(q=>'• '+q.c.name+(q.note?' — '+q.note:q.r?' — '+(q.r.label||'Reel'):''));
    return ROLE[st.role].icon+' '+st.name+(cl?' · '+cl.name:'')+' — '+new Date().toLocaleDateString('es-ES')+'\n'+(L.length?L.join('\n'):'Nada pendiente 🎉');
  };
  const show=t=>{res.innerHTML=`<textarea readonly style="${FLD};height:130px">${esc(t)}</textarea><button id="cp" style="${BTN};margin-top:6px">Copiar</button>`;
    document.getElementById('cp').onclick=()=>{const ta=res.querySelector('textarea');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}}};
  const readImg=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/im.width),cv2=document.createElement('canvas');cv2.width=im.width*k;cv2.height=im.height*k;cv2.getContext('2d').drawImage(im,0,0,cv2.width,cv2.height);ok(cv2.toDataURL('image/jpeg',.85))};im.onerror=()=>ok(null);im.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(f)});
  const needTxt=()=>{const ne=document.getElementById('ineed');if(ne)ne.innerHTML='Para el informe '+(document.getElementById('ipe').value==='mes'?'mensual':'semanal')+' necesito capturas de Instagram Insights '+periodRange(document.getElementById('ipe').value)+':'};
  if(st.role==='informes'){document.getElementById('ipe').onchange=needTxt;needTxt()}
  const makeReport=async()=>{
    const w=window.open('','_blank'); // se abre ya, antes de leer las imágenes, para que no lo bloquee el navegador
    const c=clients.find(x=>String(x.id)===document.getElementById('icl').value),per=document.getElementById('ipe').value,ig={};
    ['views','reach','inter','visits','fol','newfol','clicks'].forEach(k=>{const v=document.getElementById('ig-'+k).value.trim();if(v)ig[k]=v});
    const shots=[];
    for(const [k,l] of SHOTS){const inp=document.getElementById('sh-'+k),imgs=[];for(const f of (inp&&inp.files)||[]){const d=await readImg(f);if(d)imgs.push(d)}if(imgs.length)shots.push({l,imgs})}
    const html=reportHtml(c,per,ig,shots);
    if(!w){res.innerHTML='<div class="sub">El navegador bloqueó la ventana: permite ventanas emergentes y vuelve a pulsar.</div>';return}
    w.document.open();w.document.write(html);w.document.close();
    res.innerHTML=`<div class="sub">Informe ${per==='mes'?'mensual':'semanal'} de ${esc(c.name)} abierto en otra pestaña. Pulsa «Guardar como PDF» arriba a la derecha.${shots.length?'':' Sin capturas de Instagram: solo lleva la producción.'}</div>`;
  };
  const makeAll=per=>{ // un solo documento con el informe de cada cliente activo
    const w=window.open('','_blank');if(!w){res.innerHTML='<div class="sub">El navegador bloqueó la ventana: permite ventanas emergentes y vuelve a pulsar.</div>';return}
    const docs=clients.map(c=>reportHtml(c,per,{},[])),body=d=>d.slice(d.indexOf('<body>')+6,d.lastIndexOf('</body>')).replace(/<div class="bar">[\s\S]*?<\/div>/,'');
    w.document.open();w.document.write(docs[0].slice(0,docs[0].indexOf('<body>')+6)+'<div class="bar"><button onclick="print()">Guardar como PDF</button></div>'+docs.map(body).join('')+'</body></html>');w.document.close();
    res.innerHTML=`<div class="sub">${clients.length} informes ${per==='mes'?'mensuales':'semanales'} (uno por cliente) abiertos en otra pestaña. Solo llevan la producción: para añadir Instagram, pide cada cliente por separado.</div>`;
  };
  go.onclick=()=>{
    const t=req.value,cl=find(t);dispatch(st,cl);
    if(st.role==='informes'){
      const per=/mes|mensual/i.test(t)?'mes':'semana';document.getElementById('ipe').value=per;needTxt();
      if(/todos|cada cliente|por cliente/i.test(norm(t))){makeAll(per);return}
      if(!cl){res.innerHTML='<div class="sub">¿De qué cliente? Escribe su nombre, por ejemplo «informe mensual de '+esc((clients[0]||{}).name||'')+'», o «informe semanal de todos los clientes».</div>';return}
      document.getElementById('icl').value=cl.id;makeReport();return}
    show(text(cl));
  };
  req.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
  const igo=document.getElementById('igo');if(igo)igo.onclick=makeReport;
}
function reportHtml(c,per,ig,shots=[]){
  const M=per==='mes',now=new Date(),iso0=d=>d.toISOString().slice(0,10),t0=iso0(now),from=iso0(new Date(Date.now()-(M?30:7)*864e5)),to=iso0(new Date(Date.now()+(M?30:7)*864e5));
  const fmt=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—',n=x=>Number(String(x).replace(/\./g,'').replace(',','.')),nf=x=>isFinite(n(x))?n(x).toLocaleString('es-ES'):esc(x);
  const rs=reelsOf(c),inRange=d=>d&&d.slice(0,10)>=from&&d.slice(0,10)<=t0;
  const done={grab:rs.filter(r=>M?r.grabado:inRange(r.fechaGrab)).length,env:rs.filter(r=>M?r.enviado:inRange(r.fechaEnviadoTS)).length,sub:rs.filter(r=>M?r.subido:inRange(r.fechaSubidoTS)).length};
  const pend=rs.filter(r=>!r.subido).length;
  const next=[];Object.entries(c.pubCal||{}).forEach(([mk,by])=>Object.entries(by||{}).forEach(([rid,pd])=>{
    const r=(Array.isArray(c.reels)?c.reels:((c.reels||{})[mk]||[])).find(x=>String(x.id)===String(rid));if(!r||r.subido)return;
    [['pub','Instagram'],['tiktok','TikTok'],['youtube','YouTube']].forEach(([k,l])=>{const d=pd&&pd[k];if(d&&d>=t0&&d<=to)next.push({d,l,label:r.label||'Reel'})})}));
  next.sort((a,b)=>a.d.localeCompare(b.d));
  const ph=Math.max(0,Math.min(8,+c.phase||0),0),name=esc(c.name),title=M?'Informe mensual':'Informe semanal',period=M?`Últimos 30 días · hasta el ${fmt(t0)}`:`Semana del ${fmt(from)} al ${fmt(t0)}`;
  const card=(v,l,s,hi)=>`<div class="k${hi?' hi':''}"><small>${l}</small><b>${v}</b><span>${s||''}</span></div>`;
  const igk=[['views','Visualizaciones','en el periodo'],['reach','Cuentas alcanzadas','personas distintas'],['inter','Interacciones','me gusta, comentarios, compartidos…'],['visits','Visitas al perfil','en el periodo'],['fol','Seguidores',ig.newfol?'+'+esc(ig.newfol)+' en el periodo':''],['clicks','Clics en la bio','']].filter(([k])=>ig[k]);
  return `<!doctype html><html lang="es"><meta charset="utf-8"><title>${title} · ${name}</title><style>
  @page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;color:#15181d;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg{width:210mm;min-height:297mm;padding:18mm 16mm;page-break-after:always;position:relative}
  .cover{background:radial-gradient(circle at 85% 40%,#0b3a40 0,#0b0d10 55%);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
  .tag{letter-spacing:.3em;font-size:11px;color:#00cfe0;font-weight:700;text-transform:uppercase}
  .cover h1{font-size:54px;letter-spacing:.08em;margin:8px 0;background:linear-gradient(#fff,#9aa3ad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .line{width:60px;height:3px;background:#00cfe0;margin:18px 0}.top{font-size:12px;letter-spacing:.2em;color:#aab}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.three div{border-top:2px solid #444;padding-top:8px}.three b{font-size:26px;display:block}.three span{font-size:12px;color:#99a}
  h2{font-size:28px;margin:4px 0 6px}.sec{font-size:11px;letter-spacing:.2em;color:#00a9b8;font-weight:700;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.k{background:#f1f2f4;border-radius:12px;padding:14px}.k small{display:block;color:#667}.k b{font-size:30px;display:block;line-height:1.2}.k span{font-size:12px;color:#667}
  .k.hi{background:#00b8c8;color:#fff}.k.hi small,.k.hi span{color:#e6fcff}
  .box{background:#e5f7f9;border-left:3px solid #00b8c8;border-radius:10px;padding:14px;margin:10px 0}.box.g{background:#f1f2f4;border:0}
  table{width:100%;border-collapse:collapse;margin-top:10px}td,th{padding:8px 6px;border-bottom:1px solid #e3e5e8;text-align:left;font-size:13px}th{color:#667;font-weight:600}
  .st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.foot{position:absolute;left:16mm;right:16mm;bottom:10mm;font-size:11px;color:#889}
  .bar{position:fixed;top:0;right:0;padding:8px}.bar button{${BTN};}@media print{.bar{display:none}}
  </style><body><div class="bar"><button onclick="print()">Guardar como PDF</button></div>
  <div class="pg cover"><div class="top">Un informe de <b style="color:#00cfe0">MENTEDORAS</b></div>
   <div><div class="tag">${title}</div><h1>${name.toUpperCase()}</h1><div>${esc(c.type||'')}</div><div class="line"></div><div style="color:#aab">${period}</div></div>
   <div class="three"><div><b>${done.sub}</b><span>reels subidos</span></div><div><b>${done.grab}</b><span>reels grabados</span></div><div><b>${pend}</b><span>reels pendientes de subir</span></div></div></div>
  <div class="pg"><div class="sec">Resumen</div><h2>${M?'El mes en cifras':'La semana en cifras'}</h2>
   <p>${name} lleva ${done.sub} reel${done.sub===1?'':'s'} subido${done.sub===1?'':'s'} y ${done.grab} grabado${done.grab===1?'':'s'} en este periodo${rs.length?`; de los ${rs.length} reels de ${monthLabel(monthKey())}, quedan ${pend} por subir`:''}.</p>
   <div class="grid">${card(done.sub,'Reels subidos',M?'este mes':'esta semana',1)}${card(done.grab,'Reels grabados',M?'este mes':'esta semana')}${card(done.env,'Enviados al cliente',M?'este mes':'esta semana')}${card(pend,'Pendientes de subir','del mes actual')}${card(esc(PHASES[ph]),'Fase actual','')}${card(next.length,'Próximas publicaciones','en los próximos '+(M?30:7)+' días')}</div>
   ${igk.length?`<div class="sec" style="margin-top:22px">Instagram</div><div class="grid">${igk.map(([k,l,s],i)=>card(nf(ig[k]),l,s,i===0)).join('')}</div>`:`<div class="box g">Las cifras de Instagram (alcance, visualizaciones, seguidores) no están en el CRM. Añádelas al pedir el informe y aparecerán aquí.</div>`}
   <div class="foot">${title} · por MENTEDORAS · ${period}</div></div>
  <div class="pg"><div class="sec">Producción</div><h2>Reels de ${monthLabel(monthKey())}</h2>
   <table><tr><th>Reel</th><th>Estado</th><th>Grabado</th><th>Subido</th></tr>${rs.map(r=>{const s=reelState(r),L={pend:'Pendiente',grab:'Grabado',edit:'Editado',sub:'Subido'}[s];return `<tr><td>${esc(r.label||'Reel')}</td><td><span class="st" style="background:${REEL_COL[s]}">${L}</span></td><td>${fmt(r.fechaGrab)}</td><td>${fmt((r.fechaSubidoTS||'').slice(0,10))}</td></tr>`}).join('')||'<tr><td colspan="4">Sin reels este mes.</td></tr>'}</table>
   <div class="sec" style="margin-top:26px">Próximos pasos</div><h2>Lo que viene</h2>
   ${next.length?`<table><tr><th>Fecha</th><th>Reel</th><th>Red</th></tr>${next.map(x=>`<tr><td>${fmt(x.d)}</td><td>${esc(x.label)}</td><td>${x.l}</td></tr>`).join('')}</table>`:'<div class="box g">No hay publicaciones programadas en el calendario para este periodo.</div>'}
   <div class="foot">${title} · por MENTEDORAS · ${period}</div></div>
  ${shots.length?`<div class="pg"><div class="sec">Anexo</div><h2>Los datos originales de Instagram</h2><p style="color:#667">Capturas de Instagram Insights, ${period}.</p>
   ${shots.map(s=>`<div style="margin:12px 0"><b>${esc(s.l)}</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${s.imgs.map(i=>`<img src="${i}" style="max-width:${s.imgs.length>1?'48%':'60%'};max-height:110mm;border:1px solid #e3e5e8;border-radius:8px">`).join('')}</div></div>`).join('')}
   <div class="foot">${title} · por MENTEDORAS · ${period}</div></div>`:''}</body></html>`;
}
document.getElementById('pbody').addEventListener('click',e=>{const a=e.target.closest('[data-c]');if(!a)return;e.preventDefault();const is=islands.find(i=>String(i.c.id)===a.dataset.c);if(is)openPanel(is)});
function openPanel(is){
  if(is.staff)return openStaff(is);
  selected=is;const c=is.c,{rs,s}=stats(c),ph=Math.max(0,Math.min(8,+c.phase||0));
  const lab={pend:'Pendiente',grab:'Grabado',edit:'Editado',sub:'Subido'};
  document.getElementById('pbody').innerHTML=
   `<h2>${esc(c.name)}</h2><div class="sub">${esc(c.type||'')}</div>
    <div class="row"><span>Fase</span><span style="color:${PHC[ph]}">${esc(PHASES[ph])}</span></div>
    <div class="row"><span>Editor/es</span><span>${esc((c.editors||[]).join(', ')||'—')}</span></div>
    <div class="row"><span>Community manager</span><span>${esc(c.cm||'—')}</span></div>
    <div class="row"><span>Reels este mes</span><span>${s.sub}/${rs.length} subidos</span></div>
    <div class="reels">${rs.map(r=>{const st=reelState(r);return `<div class="reel" style="border-color:${REEL_COL[st]}"><b>${esc(r.label||'Reel')}</b><span style="color:${REEL_COL[st]}">${lab[st]}</span></div>`}).join('')}</div>
    <a class="btn" href="/">Abrir en el CRM</a>${demo?'<p class="sub">Datos de ejemplo.</p>':''}`;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){selected=null;document.getElementById('panel').classList.remove('open')}
document.getElementById('close').onclick=closePanel;

load();
</script>
